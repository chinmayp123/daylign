<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Report an issue &middot; Daylign</title>
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<style>
  /* Standalone page on purpose: a tester loads one small file and nothing from
     the app itself, so this can never pull in Daylign's data or scripts.
     Palette mirrors the app's dark theme by hand. */
  :root{
    --bg:#0b0b10; --card:#14141d; --input:#0b0b10; --border:#232330;
    --text:#f2f2f7; --muted:#8a8a9c; --accent:#6d6af8; --green:#34d399; --red:#f87171;
    --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);
       line-height:1.5;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
  .wrap{max-width:560px;margin:0 auto;padding:28px 18px 60px}
  header{margin-bottom:26px}
  .mark{width:40px;height:40px;border-radius:11px;background:var(--accent);
        display:flex;align-items:center;justify-content:center;font-weight:800;margin-bottom:14px}
  h1{margin:0 0 6px;font-size:23px;font-weight:700;letter-spacing:-.02em}
  .sub{margin:0;color:var(--muted);font-size:14px}
  .proj{display:inline-block;margin-top:10px;padding:3px 10px;border-radius:999px;
        background:rgba(109,106,248,.16);border:1px solid var(--accent);
        color:var(--accent);font-size:12px;font-weight:700}
  label{display:block;margin:20px 0 7px;font-size:13px;font-weight:600}
  .hint{color:var(--muted);font-weight:400}
  input[type=text],textarea{width:100%;padding:12px 14px;background:var(--input);
        border:1px solid var(--border);border-radius:11px;color:var(--text);
        font-family:var(--font);font-size:15px}
  input:focus,textarea:focus{outline:none;border-color:var(--accent)}
  textarea{min-height:130px;resize:vertical;line-height:1.55}
  .shots{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px}
  .shot{position:relative;width:78px;height:78px;border-radius:10px;overflow:hidden;
        border:1px solid var(--border)}
  .shot img{width:100%;height:100%;object-fit:cover;display:block}
  .shot button{position:absolute;top:3px;right:3px;width:22px;height:22px;border:none;
        border-radius:50%;background:rgba(0,0,0,.65);color:#fff;font-size:14px;
        line-height:1;cursor:pointer}
  .addshot{width:78px;height:78px;border:1px dashed var(--accent);border-radius:10px;
        background:rgba(109,106,248,.07);color:var(--accent);font-size:26px;cursor:pointer}
  .send{width:100%;min-height:50px;margin-top:26px;border:none;border-radius:13px;
        background:var(--accent);color:#fff;font-family:var(--font);font-size:16px;
        font-weight:700;cursor:pointer}
  .send:disabled{opacity:.55;cursor:default}
  .err{margin-top:12px;padding:11px 13px;border-radius:10px;background:rgba(248,113,113,.12);
       border:1px solid var(--red);color:var(--red);font-size:13px}
  .done{text-align:center;padding:60px 20px}
  .done .tick{width:62px;height:62px;margin:0 auto 20px;border-radius:50%;
       background:rgba(52,211,153,.15);border:2px solid var(--green);color:var(--green);
       display:flex;align-items:center;justify-content:center;font-size:30px}
  .again{margin-top:22px;background:none;border:1px solid var(--border);color:var(--text);
       padding:11px 20px;border-radius:11px;font-family:var(--font);font-size:14px;cursor:pointer}
  .foot{margin-top:30px;color:var(--muted);font-size:12px;text-align:center}
</style>
</head>
<body>
<div class="wrap" id="wrap">
  <header>
    <div class="mark">D</div>
    <h1>Report an issue</h1>
    <p class="sub">Tell me what went wrong and I will pick it up. Screenshots help a lot.</p>
    <span class="proj" id="projTag" hidden></span>
  </header>

  <form id="f" novalidate>
    <label for="who">Your name</label>
    <input type="text" id="who" autocomplete="name" placeholder="So I know who to follow up with">

    <label for="title">What happened? <span class="hint">&mdash; one line</span></label>
    <input type="text" id="title" maxlength="120" placeholder="Save button does nothing on the diet page">

    <label for="detail">Details <span class="hint">&mdash; what you did, what you expected</span></label>
    <textarea id="detail" placeholder="I tapped Save after entering lunch. Nothing happened, and the entry was gone when I came back."></textarea>

    <label>Screenshots <span class="hint">&mdash; optional, up to 3</span></label>
    <div class="shots" id="shots">
      <button type="button" class="addshot" id="addShot" aria-label="Add a screenshot">+</button>
    </div>
    <input type="file" id="file" accept="image/*" hidden multiple>

    <button type="submit" class="send" id="send">Send report</button>
    <div class="err" id="err" hidden></div>
  </form>

  <p class="foot">This goes to the board. Nothing else on this page is shared.</p>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
firebase.initializeApp({
  apiKey: "AIzaSyDlPGvGtCFDdmKRxWCXvGTPMj4PmZP7Xes",
  authDomain: "lifestack-d5300.firebaseapp.com",
  databaseURL: "https://lifestack-d5300-default-rtdb.firebaseio.com",
  projectId: "lifestack-d5300",
  storageBucket: "lifestack-d5300.firebasestorage.app",
  messagingSenderId: "126263493016",
  appId: "1:126263493016:web:e3afbc4136d45525d9abed"
});
const db = firebase.database();

// The LINK decides the project, not the tester: send each group its own URL
// (report.html?project=BTC). That keeps a picker off the form and means a
// tester cannot file against a project they were never given.
const project = (new URLSearchParams(location.search).get('project') || '').slice(0, 40);
if (project) {
  const t = document.getElementById('projTag');
  t.textContent = project;
  t.hidden = false;
}

// Same downscale the food-photo flow uses. A phone screenshot is 2-4 MB; this
// brings it to roughly 150 KB, which matters because these are stored as base64
// in the database rather than in a file bucket.
const MAX_DIM = 1400, MAX_SHOTS = 3;
const shots = [];

function resize(file) {
  return new Promise((res, rej) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const s = Math.min(1, MAX_DIM / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * s);
      c.height = Math.round(img.height * s);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      res(c.toDataURL('image/jpeg', 0.8));
    };
    img.onerror = e => { URL.revokeObjectURL(url); rej(e); };
    img.src = url;
  });
}

function drawShots() {
  const host = document.getElementById('shots');
  host.querySelectorAll('.shot').forEach(n => n.remove());
  shots.forEach((src, i) => {
    const d = document.createElement('div');
    d.className = 'shot';
    d.innerHTML = '<img alt="screenshot"><button type="button" aria-label="Remove">&times;</button>';
    d.querySelector('img').src = src;
    d.querySelector('button').addEventListener('click', () => { shots.splice(i, 1); drawShots(); });
    host.insertBefore(d, document.getElementById('addShot'));
  });
  document.getElementById('addShot').hidden = shots.length >= MAX_SHOTS;
}

document.getElementById('addShot').addEventListener('click', () => document.getElementById('file').click());

document.getElementById('file').addEventListener('change', async e => {
  const room = MAX_SHOTS - shots.length;
  for (const f of [...e.target.files].slice(0, room)) {
    try { shots.push(await resize(f)); } catch (_) { /* skip anything unreadable */ }
  }
  e.target.value = '';
  drawShots();
});

function fail(msg) {
  const e = document.getElementById('err');
  e.textContent = msg;
  e.hidden = false;
}

document.getElementById('f').addEventListener('submit', async ev => {
  ev.preventDefault();
  const title = document.getElementById('title').value.trim();
  if (!title) { fail('Give it a one-line summary so I know what it is.'); return; }

  const btn = document.getElementById('send');
  btn.disabled = true;
  btn.textContent = 'Sending...';
  document.getElementById('err').hidden = true;

  try {
    await db.ref('inbox').push({
      title,
      detail: document.getElementById('detail').value.trim().slice(0, 4000),
      who: document.getElementById('who').value.trim().slice(0, 60),
      project,
      shots,
      at: Date.now(),
      status: 'new'
    });
    document.getElementById('wrap').innerHTML =
      '<div class="done"><div class="tick">&#10003;</div>' +
      '<h1>Sent</h1><p class="sub">Thanks &mdash; it is on the board now.</p>' +
      '<button class="again" id="againBtn">Report another</button></div>';
    document.getElementById('againBtn').addEventListener('click', () => location.reload());
  } catch (err) {
    btn.disabled = false;
    btn.textContent = 'Send report';
    fail('Could not send: ' + (err && err.message ? err.message : 'unknown error'));
  }
});
</script>
</body>
</html>
