name: Calendar sync

# Pulls the secret iCal feed(s) and writes the week into Firebase for Daylign.
#
# This exists because iOS skips time-of-day Shortcut automations when the phone
# is locked — the health sync misses roughly one night in four for that reason.
# Nothing here touches the phone, so it runs whether the device is locked, flat,
# or in another country.

on:
  schedule:
    # Hourly on the half hour. GitHub's cron can drift 5-15 minutes under load,
    # which is irrelevant for a calendar and the reason this is not on :00 with
    # everyone else's jobs.
    - cron: '30 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Print the events without writing to Firebase'
        type: boolean
        default: false

# Only one sync in flight; a queued run has nothing to add over the newer one.
concurrency:
  group: calendar-sync
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Until the ICS_URLS secret exists there is nothing to sync, and the guard
    # has to live in a STEP: the `secrets` context is not available in a
    # job-level `if:`, so `if: ${{ secrets.ICS_URLS != '' }}` made the whole
    # file invalid and every scheduled run failed in 0s with "workflow file
    # issue" — the hourly failure email this was written to prevent.
    env:
      ICS_URLS: ${{ secrets.ICS_URLS }}
    steps:
      - name: Is a feed configured?
        id: guard
        run: |
          if [ -z "$ICS_URLS" ]; then
            echo "ICS_URLS is not set — nothing to sync yet."
            echo 'configured=false' >> "$GITHUB_OUTPUT"
          else
            echo 'configured=true' >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.guard.outputs.configured == 'true'

      - uses: actions/setup-node@v4
        if: steps.guard.outputs.configured == 'true'
        with:
          node-version: '24'

      - name: Fetch calendars and write to Firebase
        if: steps.guard.outputs.configured == 'true'
        env:
          FIREBASE_URL: https://lifestack-d5300-default-rtdb.firebaseio.com
          DAYLIGN_TZ: ${{ vars.DAYLIGN_TZ || 'America/New_York' }}
          DAYS_AHEAD: '7'
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
        run: node tools/ics-to-daylign.mjs
